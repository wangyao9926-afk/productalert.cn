      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-22" y="-22" width="172" height="172" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
