[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public API origin compiled into the production React frontend.
  VITE_API_BASE_URL = "https://productalert.up.railway.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
